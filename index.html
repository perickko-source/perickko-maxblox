<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MaxBlox Cesta Loca</title>
  
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', system-ui, sans-serif; }
    #gameWrapper { position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(10, 15, 30, 0.92); color: white; text-align: center; padding: 20px; z-index: 10; }
    #ui h1 { font-size: 2em; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); color: #FFD166; }
    #ui h2 { font-size: 1.3em; margin: 15px 0 10px; color: #E0E0E0; }
    .subtitle { font-size: 0.9em; color: #B0B0B0; margin-bottom: 20px; font-weight: normal; }
    .btn { padding: 14px 24px; font-size: 1em; border: none; border-radius: 10px; color: white; cursor: pointer; margin: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); font-weight: bold; min-width: 180px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .btn:active { transform: scale(0.96); }
    .btn-mode { background: #0077B6; }
    .btn-start { background: #2A9D8F; }
    .btn-opt { background: #6C757D; font-size: 0.9em; padding: 10px 20px; }
    .input-group { margin: 10px 0; width: 80%; max-width: 280px; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #B0B0B0; }
    .input-group input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #444; background: #222; color: white; font-size: 1em; text-align: center; touch-action: manipulation; }
    .input-group input:focus { outline: none; border-color: #0077B6; }
    .hidden { display: none !important; }
    .life-loss-effect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.3); pointer-events: none; animation: flashRed 0.3s ease-out; z-index: 20; }
    @keyframes flashRed { 0% { opacity: 1; } 100% { opacity: 0; } }

    #motivation-box {
      position: absolute; top: 16%; width: 100%; text-align: center;
      font-size: 32px; font-weight: 900; color: #FFD700;
      text-shadow: 0 4px 8px rgba(0,0,0,0.8), 0 0 15px rgba(255, 215, 0, 0.4);
      pointer-events: none; z-index: 5; opacity: 0; transform: scale(0.5);
    }
    .pop-animation { animation: popUpAnim 1.2s ease-out forwards; }
    @keyframes popUpAnim {
      0% { opacity: 0; transform: scale(0.5) translateY(20px); }
      30% { opacity: 1; transform: scale(1.2) translateY(0); }
      45% { transform: scale(0.95); }
      60% { transform: scale(1.05); }
      75% { transform: scale(1); opacity: 1; }
      100% { opacity: 0; transform: scale(1.1) translateY(-30px); }
    }

    .character-select {
      display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; justify-content: center;
    }
    .character-btn {
      width: 120px; height: 140px; border: 4px solid #444; border-radius: 15px;
      background: rgba(255,255,255,0.1); cursor: pointer; transition: all 0.3s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 10px;
    }
    .character-btn:hover { border-color: #FFD166; transform: scale(1.05); }
    .character-btn.selected { border-color: #4CAF50; background: rgba(76, 175, 80, 0.2); }
    .character-btn img { width: 80px; height: 80px; object-fit: contain; }
    .character-btn.disabled { opacity: 0.3; pointer-events: none; }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="motivation-box"></div>
    <div id="ui"></div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');
    const wrapper = document.getElementById('gameWrapper');
    const msgBox = document.getElementById('motivation-box');

    const characterImages = {
      max: new Image(),
      sam: new Image(),
      mama: new Image()
    };
    characterImages.max.src = 'max_cesta.png';
    characterImages.sam.src = 'sam_cesta.png';
    characterImages.mama.src = 'mama_cesta.png';
    
    let charactersLoaded = { max: false, sam: false, mama: false };
    
    function calculateBasketDimensions() {
      const targetHeight = 105;
      const aspectRatio = 731 / 902;
      const calculatedWidth = Math.round(targetHeight * aspectRatio);
      window.BASE_BASKET_W = calculatedWidth;
      window.BASE_BASKET_H = targetHeight;
    }
    
    characterImages.max.onload = () => { 
      charactersLoaded.max = true; 
      calculateBasketDimensions();
    };
    characterImages.sam.onload = () => charactersLoaded.sam = true;
    characterImages.mama.onload = () => charactersLoaded.mama = true;

    const expresionesImg = new Image();
    expresionesImg.src = 'expresiones.png';
    let expresionesLoaded = false;
    expresionesImg.onload = () => { expresionesLoaded = true; };
    
    const EXP_CELLS = 4;
    const EXP_STRIDE = 400;
    const EXP_CELL_W = 375;
    const EXP_CELL_H = 375;
    const EXP_OFFSET = (EXP_STRIDE - EXP_CELL_W) / 2;
    const TOTAL_EXPRESSIONS = 16;
    let currentExpression = 0;
    let currentLevelMessage = '';

    const levelCompleteMessages = [
      "¡Nivel Completado! 🎉",
      "¡Brutal! ¡Siguiente! 🚀",
      "¡Increíble! 💪",
      "¡Eres una máquina! ⚡",
      "¡A por el siguiente! 🎯",
      "¡Qué crack! 🏆",
      "¡Imparable! 🔥",
      "¡Genial! Sigue así 🌟"
    ];

    const portadaImg = new Image(); portadaImg.src = 'portada.png';
    let portadaLoaded = false;
    portadaImg.onload = () => portadaLoaded = true;
    portadaImg.onerror = () => portadaLoaded = false;

    // 🎨 SEIS SPRITESHEETS DE OBJETOS ROBLOX (array para escalabilidad)
    const robloxSheets = [
      { img: new Image(), loaded: false },
      { img: new Image(), loaded: false },
      { img: new Image(), loaded: false },
      { img: new Image(), loaded: false },
      { img: new Image(), loaded: false },
      { img: new Image(), loaded: false }
    ];
    robloxSheets[0].img.src = 'roblox-items1.png';
    robloxSheets[1].img.src = 'roblox-items2.png';
    robloxSheets[2].img.src = 'roblox-items3.png';
    robloxSheets[3].img.src = 'roblox-items4.png';
    robloxSheets[4].img.src = 'roblox-items5.png';
    robloxSheets[5].img.src = 'roblox-items6.png';
    
    robloxSheets.forEach((sheet, i) => {
      sheet.img.onload = () => { sheet.loaded = true; };
    });
    
    const ROBLOX_COLS = 4;
    const ROBLOX_ROWS = 2;
    const ROBLOX_CELL_W = 375;
    const ROBLOX_CELL_H = 375;
    const TOTAL_ROBLOX_ITEMS = 8;
    const TOTAL_SHEETS = 6; // ✅ Total de hojas disponibles

    let blocks = [];
    function initBlocks() {
      blocks = [];
      for(let i=0; i<12; i++) {
        blocks.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: 20 + Math.random() * 40,
          color: ['#FF4444', '#44FF44', '#4444FF', '#FFFF44', '#FF44FF', '#44FFFF'][Math.floor(Math.random() * 6)],
          speed: 0.1 + Math.random() * 0.2,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.01
        });
      }
    }
    function drawBlocks() {
      blocks.forEach(b => {
        b.y += b.speed;
        b.rotation += b.rotSpeed;
        if(b.y > canvas.height + b.size) {
          b.y = -b.size;
          b.x = Math.random() * canvas.width;
        }
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rotation);
        ctx.fillStyle = b.color;
        ctx.globalAlpha = 0.3;
        ctx.fillRect(-b.size/2, -b.size/2, b.size, b.size);
        ctx.restore();
      });
      ctx.globalAlpha = 1.0;
    }

    let audioCtx;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    function playSound(t) {
      initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
      const now=audioCtx.currentTime, o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      if(t==='catch'){ o.type='sine'; o.frequency.setValueAtTime(600,now); o.frequency.exponentialRampToValueAtTime(900,now+0.1); g.gain.setValueAtTime(0.15,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.1); o.start(now); o.stop(now+0.1); }
      else if(t==='levelup'){ [400,600,800].forEach((f,i)=>{ const os=audioCtx.createOscillator(), gs=audioCtx.createGain(); os.connect(gs); gs.connect(audioCtx.destination); os.type='square'; os.frequency.value=f; gs.gain.setValueAtTime(0.1,now+i*0.12); gs.gain.exponentialRampToValueAtTime(0.01,now+i*0.12+0.15); os.start(now+i*0.12); os.stop(now+i*0.12+0.15); }); }
      else if(t==='gameover'){ o.type='sawtooth'; o.frequency.setValueAtTime(300,now); o.frequency.linearRampToValueAtTime(100,now+0.5); g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0.01,now+0.5); o.start(now); o.stop(now+0.5); }
      else if(t==='click'){ o.type='sine'; o.frequency.value=800; g.gain.setValueAtTime(0.1,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.05); o.start(now); o.stop(now+0.05); }
    }
    
    const bgMusic = new Audio('maxlox.ogg');
    bgMusic.loop = true; bgMusic.volume = 0.3;
    bgMusic.onerror = () => console.log('Música no encontrada, jugando sin música');

    const STORAGE_KEY = 'maxlox_highscores';
    const MAX_RECORDS = 5;
    function getRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; } }
    function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
    function addRecord(name, score) { const records = getRecords(); records.push({ name, score, date: new Date().toLocaleDateString() }); records.sort((a, b) => b.score - a.score); saveRecords(records.slice(0, MAX_RECORDS)); }
    function renderLeaderboard() {
      const records = getRecords(); const container = document.getElementById('leaderboardSection'); if(!container) return;
      let html = '<div style="width:90%; max-width:300px; margin:10px auto; background:rgba(255,255,255,0.05); border-radius:12px; padding:12px; border:1px solid rgba(255,255,255,0.1);">';
      html += '<h3 style="color:#FFD166; margin:0 0 10px 0; font-size:1.1em; text-align:center;">🏆 Top Récords</h3>';
      if(records.length===0) html += '<p style="text-align:center; color:#aaa; font-size:0.9em;">Aún no hay récords</p>';
      else records.forEach((r,i) => { const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':''; html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:${i<records.length-1?'1px solid rgba(255,255,255,0.1)':'none'}; font-size:0.95em;"><span>${medal} ${r.name}</span><span style="color:#4CAF50; font-weight:bold; font-size:1.1em;">${r.score}</span></div>`; });
      html += '</div>'; container.innerHTML = html;
    }

    let gameMode = '1p', p1Name = 'Jugador 1', p2Name = 'Jugador 2';
    let player1Character = 'max';
    let player2Character = 'sam';
    let basket1X, basket2X;
    let basketW = 85, basketH = 105;
    const basketOffX = 0, basketOffY = -80;
    let score1 = 0, score2 = 0, sharedScore = 0;
    let lives1 = 5, lives2 = 5, sharedLives = 5;
    let gameOver = false, started = false;
    let items = [], particles = [], floatingTexts = [], fallingPowerups = [], frameCount = 0, keys = {};
    let level = 1, collectedInLevel = 0, targetPerLevel = 20;
    let gameState = 'menu', fallSpeed = 2.0, spawnInterval = 60, confirmBtnRect = null;
    let shakeIntensity = 0;

    let magnetActive = false, magnetTimer = 0;
    const MAGNET_DURATION = 360, MAGNET_RANGE = 380, MAGNET_FORCE = 6.5;

    let sizeBoostActive = false;
    let sizeBoostTimer = 0;
    const SIZE_BOOST_DURATION = 480;
    const BASE_BASKET_W = 85, BASE_BASKET_H = 105;

    const phrases = ["¡Genial!", "¡Sigue así!", "¡Imparable!", "¡Brutal!", "¡Qué reflejos!", "¡A por todas!", "¡Tú puedes!", "¡No pares!", "¡Eres un PRO!", "¡Modo Roblox!"];
    let msgTimeout = null;

    function calculateTargetForLevel(lvl) {
      return 20 + (lvl - 1) * 10;
    }

    function resize() {
      const ratio = 9/16;
      const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      if(vw/vh < ratio) { wrapper.style.width = vw+'px'; wrapper.style.height = (vw/ratio)+'px'; canvas.width=vw; canvas.height=vw/ratio; }
      else { wrapper.style.height = vh+'px'; wrapper.style.width = (vh*ratio)+'px'; canvas.height=vh; canvas.width=vh*ratio; }
      basket1X = canvas.width*0.25; basket2X = canvas.width*0.75;
      initBlocks();
    }
    resize();
    window.addEventListener('resize', resize);
    if(window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    function showMotivationMsg() {
      if(gameState !== 'playing') return;
      const text = phrases[Math.floor(Math.random() * phrases.length)];
      msgBox.innerText = text; msgBox.classList.remove('pop-animation'); void msgBox.offsetWidth; msgBox.classList.add('pop-animation'); scheduleNextMessage();
    }
    function scheduleNextMessage() {
      if(msgTimeout) clearTimeout(msgTimeout);
      if(gameState === 'playing') msgTimeout = setTimeout(showMotivationMsg, 5000 + Math.random() * 7000);
    }

    function showSplashScreen() {
      if(!portadaLoaded && !portadaImg.complete) {
        setTimeout(() => {
          if(!portadaLoaded) { showMenu(); } else { startSplashAnimation(); }
        }, 500);
        return;
      }
      startSplashAnimation();
    }

    function startSplashAnimation() {
      const splash = document.createElement('div');
      splash.id = 'splash-screen';
      splash.style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;background:#1a1a2e url('portada.png') no-repeat center center;background-size:cover;z-index:200;transition:opacity 1s ease;`;
      
      const loaderText = document.createElement('div');
      loaderText.innerText = 'CARGANDO...';
      loaderText.style.cssText = `position:absolute;top:62%;left:50%;transform:translateX(-50%);color:#FFD166;font-family:sans-serif;font-weight:bold;font-size:1.2em;text-shadow:2px 2px 4px #000;letter-spacing:2px;z-index:201;`;
      
      const barBg = document.createElement('div');
      barBg.style.cssText = `position:absolute;top:67%;left:50%;transform:translateX(-50%);width:80%;max-width:300px;height:8px;background:rgba(255,255,255,0.2);border-radius:4px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.5);z-index:201;`;
      
      const bar = document.createElement('div');
      bar.style.cssText = `width:0%;height:100%;background:#FFD166;border-radius:4px;transition:width 3s linear;`;
      
      barBg.appendChild(bar);
      splash.appendChild(loaderText);
      splash.appendChild(barBg);
      wrapper.appendChild(splash);
      
      const startLoading = () => {
        requestAnimationFrame(() => { bar.style.width = '100%'; });
        setTimeout(() => { splash.style.opacity = '0'; setTimeout(() => { splash.remove(); showMenu(); }, 1000); }, 3000);
      };
      startLoading();
    }

    function showMenu() {
      bgMusic.playbackRate = 1.0; gameState = 'menu'; started = false;
      if(msgTimeout) clearTimeout(msgTimeout); msgBox.classList.remove('pop-animation'); msgBox.innerText = '';
      ui.classList.remove('hidden');
      ui.innerHTML = `<h1>MaxBlox Cesta Loca</h1><p class="subtitle">🎮 Atrapa Objetos Roblox</p><button class="btn btn-mode" onclick="showNameInput('1p')">👤 1 Jugador</button><button class="btn btn-mode" onclick="showNameInput('2p-coop')">🤝 2 Jugadores Cooperativo</button><button class="btn btn-mode" onclick="showNameInput('2p-vs')">⚔️ 2 Jugadores Competitivo</button>`;
    }

    window.showNameInput = function(mode) {
      playSound('click'); gameMode = mode; gameState = 'nameInput';
      const is2p = mode.includes('2p');
      
      if(is2p) {
        ui.innerHTML = `<h1>👥 Nombres</h1><div class="input-group"><label>Nombre Jugador 1</label><input type="text" id="name1" value="${p1Name}" maxlength="10"></div><div class="input-group"><label>Nombre Jugador 2</label><input type="text" id="name2" value="${p2Name}" maxlength="10"></div><button class="btn btn-start" id="nextBtn">Siguiente ▶</button>`;
        document.getElementById('nextBtn').onclick = () => {
          p1Name = document.getElementById('name1').value.trim() || 'Jugador 1';
          p2Name = document.getElementById('name2').value.trim() || 'Jugador 2';
          playSound('click');
          showCharacterSelect(1);
        };
      } else {
        p1Name = 'Jugador 1';
        player1Character = 'max';
        playSound('click');
        startGame();
      }
    };

    function showCharacterSelect(playerNum) {
      gameState = 'characterSelect';
      const availableChars = ['max', 'sam', 'mama'];
      
      if(playerNum === 2) {
        const idx = availableChars.indexOf(player1Character);
        if(idx > -1) availableChars.splice(idx, 1);
      }
      
      let charButtons = '';
      availableChars.forEach(char => {
        charButtons += `<div class="character-btn" onclick="selectCharacter('${char}', ${playerNum})">
          <img src="${characterImages[char].src}" alt="${char}">
        </div>`;
      });
      
      ui.innerHTML = `
        <h2>${playerNum === 1 ? '👤 Jugador 1' : '👤 Jugador 2'}, elige tu personaje</h2>
        <div class="character-select">${charButtons}</div>
      `;
    }

    window.selectCharacter = function(char, playerNum) {
      playSound('click');
      if(playerNum === 1) {
        player1Character = char;
        showCharacterSelect(2);
      } else {
        player2Character = char;
        startGame();
      }
    };

    function startGame() {
      score1 = score2 = sharedScore = 0; level = 1; collectedInLevel = 0;
      targetPerLevel = calculateTargetForLevel(1);
      gameOver = false; started = true; gameState = 'playing';
      basketW = BASE_BASKET_W; basketH = BASE_BASKET_H;
      sizeBoostActive = false; sizeBoostTimer = 0;
      items = []; particles = []; floatingTexts = []; fallingPowerups = []; frameCount = 0; keys = {};
      fallSpeed = 2.0; spawnInterval = 60; shakeIntensity = 0;
      magnetActive = false; magnetTimer = 0;
      if(gameMode === '1p') { sharedLives = 5; basket1X = canvas.width/2; }
      else { lives1 = lives2 = 4; sharedLives = 5; basket1X = canvas.width*0.25; basket2X = canvas.width*0.75; }
      bgMusic.play().catch(()=>{}); ui.classList.add('hidden');
      scheduleNextMessage();
    }

    function spawnItem() {
      const roll = Math.random();
      if(roll < 0.025) { fallingPowerups.push({x: Math.random()*(canvas.width*0.8)+canvas.width*0.1, y:-30, vy: fallSpeed*0.7, type: 'magnet', r: 24}); return; }
      if(roll < 0.045) { fallingPowerups.push({x: Math.random()*(canvas.width*0.8)+canvas.width*0.1, y:-30, vy: fallSpeed*0.7, type: 'size', r: 24}); return; }
      
      // 🔄 Rotación entre 6 hojas: 0, 1, 2, 3, 4, 5, 0, 1, 2...
      const currentSheet = (level - 1) % TOTAL_SHEETS;
      const itemIdx = Math.floor(Math.random() * TOTAL_ROBLOX_ITEMS);
      let x, vy, side;
      if(gameMode === '1p') { x = Math.random()*(canvas.width*0.6)+canvas.width*0.2; side = 1; }
      else { side = Math.random()<0.5?1:2; x = side===1 ? Math.random()*(canvas.width*0.35)+canvas.width*0.075 : Math.random()*(canvas.width*0.35)+canvas.width*0.575; }
      vy = fallSpeed + Math.random()*0.3;
      items.push({ x, y: -30, r:20, vy, itemIdx, rot:0, rotSpd:(Math.random()-0.5)*0.05, side, sheet: currentSheet });
    }

    function spawnParticles(x, y, count, color) { for(let i=0; i<count; i++) particles.push({x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-2, life:1.0, color, size:Math.random()*4+2}); }
    function spawnFloatingText(x, y, text, color) { floatingTexts.push({x, y, vy:-1.5, text, color, life:1.0, scale:1.0}); }
    function triggerLifeLoss() { const flash = document.createElement('div'); flash.className = 'life-loss-effect'; wrapper.appendChild(flash); setTimeout(() => flash.remove(), 300); shakeIntensity = 15; }

    function update() {
      if(gameState !== 'playing') return;
      frameCount++; if(frameCount % spawnInterval === 0) spawnItem();
      if(shakeIntensity > 0) { shakeIntensity *= 0.9; if(shakeIntensity < 0.5) shakeIntensity = 0; }
      
      if(sizeBoostActive) {
        sizeBoostTimer--;
        if(sizeBoostTimer <= 0) {
          sizeBoostActive = false;
          basketW = BASE_BASKET_W; basketH = BASE_BASKET_H;
        }
      }

      if(magnetActive) {
        magnetTimer--; if(magnetTimer <= 0) magnetActive = false;
        const targets = [{x: basket1X, y: canvas.height-180}];
        if(gameMode !== '1p') targets.push({x: basket2X, y: canvas.height-180});
        for(let e of items) {
          let closest = targets[0], minD = 1e9;
          for(let t of targets) { const d = Math.hypot(e.x-t.x, e.y-t.y); if(d < minD) { minD = d; closest = t; } }
          if(minD < MAGNET_RANGE && minD > 8) { e.x += ((closest.x-e.x)/minD)*MAGNET_FORCE; e.y += ((closest.y-e.y)/minD)*MAGNET_FORCE; }
        }
      }
      const spd = 6;
      if(gameMode === '1p') { if(keys['ArrowLeft']) basket1X = Math.max(basketW/2, basket1X-spd); if(keys['ArrowRight']) basket1X = Math.min(canvas.width-basketW/2, basket1X+spd); }
      else { if(keys['ArrowLeft']) basket1X = Math.max(basketW/2, basket1X-spd); if(keys['ArrowRight']) basket1X = Math.min(canvas.width*0.45, basket1X+spd); if(keys['a']||keys['A']) basket2X = Math.max(canvas.width*0.55, basket2X-spd); if(keys['d']||keys['D']) basket2X = Math.min(canvas.width-basketW/2, basket2X+spd); }
      
      const basketBaseY = canvas.height-180, basketVisualTop = basketBaseY+basketOffY, basketCenterY = basketVisualTop+basketH/2+26;
      const b1 = { l: basket1X-basketW/2+basketOffX, r: basket1X+basketW/2+basketOffX, c: basketCenterY };
      const b2 = { l: basket2X-basketW/2+basketOffX, r: basket2X+basketW/2+basketOffX, c: basketCenterY };

      for(let i=fallingPowerups.length-1; i>=0; i--) {
        let p = fallingPowerups[i]; p.y += p.vy; let caught = false;
        if(p.y>=b1.c-p.r && p.y<=b1.c+basketH/2 && p.x>b1.l && p.x<b1.r) caught = true;
        if(gameMode!=='1p' && p.y>=b2.c-p.r && p.y<=b2.c+basketH/2 && p.x>b2.l && p.x<b2.r) caught = true;
        if(caught) {
          if(p.type === 'magnet') { magnetActive = true; magnetTimer = MAGNET_DURATION; playSound('levelup'); }
          else if(p.type === 'size') { 
            basketW = BASE_BASKET_W * 1.2; 
            basketH = BASE_BASKET_H * 1.2; 
            sizeBoostActive = true; 
            sizeBoostTimer = SIZE_BOOST_DURATION; 
            playSound('levelup'); 
          }
          fallingPowerups.splice(i,1); continue;
        }
        if(p.y > basketVisualTop+basketH+20) fallingPowerups.splice(i,1);
      }

      for(let i=items.length-1; i>=0; i--) {
        let e = items[i]; e.y += e.vy; e.rot += e.rotSpd; let caught = false;
        if(e.y>=b1.c-e.r && e.y<=b1.c+basketH/2) {
          if(gameMode==='1p' && e.x>b1.l && e.x<b1.r) { sharedScore++; caught=true; }
          else if(gameMode==='2p-coop' && ((e.x>b1.l&&e.x<b1.r)||(e.x>b2.l&&e.x<b2.r))) { sharedScore++; caught=true; }
          else if(gameMode==='2p-vs' && ((e.side===1&&e.x>b1.l&&e.x<b1.r)||(e.side===2&&e.x>b2.l&&e.x>b2.r))) { if(e.side===1) score1++; else score2++; caught=true; }
        }
        if(caught) {
          playSound('catch'); collectedInLevel++; items.splice(i,1); spawnParticles(e.x, e.y, 8, '#FFD166'); spawnFloatingText(e.x, e.y-20, "+1", "#FFFFFF");
          if(collectedInLevel >= targetPerLevel) {
            currentExpression = Math.floor(Math.random() * TOTAL_EXPRESSIONS);
            currentLevelMessage = levelCompleteMessages[Math.floor(Math.random() * levelCompleteMessages.length)];
            gameState='levelConfirm'; 
            playSound('levelup');
            if(msgTimeout) clearTimeout(msgTimeout);
            msgBox.classList.remove('pop-animation');
            msgBox.innerText = '';
          } continue;
        }
        if(e.y-e.r > basketVisualTop+basketH+15) {
          triggerLifeLoss();
          if(gameMode==='1p'||gameMode==='2p-coop') { sharedLives--; if(sharedLives<=0){ gameState='gameOver'; playSound('gameover'); shakeIntensity=0; showGameOverUI(); } }
          else { if(e.side===1) lives1--; else lives2--; if(lives1<=0||lives2<=0){ gameState='gameOver'; playSound('gameover'); shakeIntensity=0; showGameOverUI(); } }
          items.splice(i,1);
        }
      }
      for(let i=particles.length-1; i>=0; i--) { let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.03; if(p.life<=0) particles.splice(i,1); }
      for(let i=floatingTexts.length-1; i>=0; i--) { let t=floatingTexts[i]; t.y+=t.vy; t.life-=0.02; t.scale+=0.01; if(t.life<=0) floatingTexts.splice(i,1); }
    }

    function showGameOverUI() {
      if(msgTimeout) clearTimeout(msgTimeout); msgBox.classList.remove('pop-animation'); msgBox.innerText = ''; ui.classList.remove('hidden');
      let scoreDisplay = `Puntuación: <b>${sharedScore}</b>`;
      if(gameMode === '2p-vs') { const winner = score1>score2 ? p1Name : (score2>score1 ? p2Name : 'Empate'); scoreDisplay = `${p1Name}: <b>${score1}</b> | ${p2Name}: <b>${score2}</b><br>Ganador: <b>${winner}</b>`; }
      ui.innerHTML = `<h1 style="color:#EF476F; font-size:2em; margin-bottom:5px;">¡Fin de la Partida!</h1><p style="font-size:1.1em; margin:10px 0; color:#FFF;">${scoreDisplay}</p><div id="inputSection"><div class="input-group" style="margin:15px auto;"><label>Tu Nombre</label><input type="text" id="playerNameInput" maxlength="12" placeholder="Escribe tu nombre" style="width:85%; padding:10px; font-size:1em;"></div><button class="btn btn-start" onclick="handleSaveScore()">💾 Guardar Récord</button></div><div id="leaderboardSection" class="hidden"></div><button class="btn btn-opt" style="margin-top:15px;" onclick="showMenu()">🔙 Volver al Menú</button>`;
      renderLeaderboard();
    }
    window.handleSaveScore = function() { const name = document.getElementById('playerNameInput').value.trim() || 'Anónimo'; addRecord(name, sharedScore); document.getElementById('inputSection').classList.add('hidden'); document.getElementById('leaderboardSection').classList.remove('hidden'); renderLeaderboard(); };

    function drawBasket(x, y, imgRef) { 
      if(imgRef && imgRef.complete) {
        ctx.drawImage(imgRef, x-basketW/2+basketOffX, y+basketOffY, basketW, basketH); 
      } else { 
        ctx.fillStyle='#D4A373'; 
        ctx.fillRect(x-basketW/2, y-basketH/2, basketW, basketH); 
      } 
    }

    // 🎨 DIBUJAR OBJETO ROBLOX (soporte para N hojas usando array)
    function drawRobloxItem(cx, cy, itemIdx, sheet, size) {
      const s = robloxSheets[sheet];
      
      if(!s.loaded || !s.img.complete) {
        const fallbackEmojis = ['🪙', '🎁', '🟥', '🐶', '💎', '⚔️', '🎩', '🏆'];
        ctx.font = '40px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fallbackEmojis[itemIdx] || '💰', cx, cy);
        return;
      }
      
      const col = itemIdx % ROBLOX_COLS;
      const row = Math.floor(itemIdx / ROBLOX_COLS);
      const srcX = col * ROBLOX_CELL_W;
      const srcY = row * ROBLOX_CELL_H;
      
      ctx.save();
      ctx.drawImage(
        s.img,
        srcX, srcY, ROBLOX_CELL_W, ROBLOX_CELL_H,
        cx - size/2, cy - size/2, size, size
      );
      ctx.restore();
    }

    function drawExpression(cx, cy, size) {
      if(!expresionesLoaded || !expresionesImg.complete) {
        ctx.fillStyle = '#FFD166';
        ctx.font = '80px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎉', cx, cy);
        return;
      }
      
      const col = currentExpression % EXP_CELLS;
      const row = Math.floor(currentExpression / EXP_CELLS);
      const srcX = col * EXP_STRIDE + EXP_OFFSET;
      const srcY = row * EXP_STRIDE + EXP_OFFSET;
      
      ctx.save();
      ctx.drawImage(
        expresionesImg,
        srcX, srcY, EXP_CELL_W, EXP_CELL_H,
        cx - size/2, cy - size/2, size, size
      );
      ctx.restore();
    }

    function draw(time = 0) {
      if(gameState === 'gameOver') return;
      ctx.save();
      if(shakeIntensity > 0) ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
      
      const grad = ctx.createLinearGradient(0,0,0,canvas.height);
      grad.addColorStop(0, '#87CEEB'); grad.addColorStop(1, '#E0F7FA');
      ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
      drawBlocks();
      
      if(gameState === 'playing') {
        if(gameMode!=='1p') { ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=3; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.moveTo(canvas.width/2,0); ctx.lineTo(canvas.width/2,canvas.height-180); ctx.stroke(); ctx.setLineDash([]); }
        
        const bY = canvas.height-180;
        if(gameMode==='1p') {
          drawBasket(basket1X, bY, characterImages.max);
        } else {
          drawBasket(basket1X, bY, characterImages[player1Character]);
          drawBasket(basket2X, bY, characterImages[player2Character]);
        }
        
        const itemSize = 55;
        for(let e of items) { 
          ctx.save(); 
          ctx.translate(e.x, e.y); 
          ctx.rotate(e.rot); 
          drawRobloxItem(0, 0, e.itemIdx, e.sheet, itemSize);
          ctx.restore();
        }
        
        ctx.font='34px serif';
        for(let p of fallingPowerups) ctx.fillText(p.type==='magnet'?'🧲': p.type==='size'?'🎁':'❓', p.x, p.y);
        for(let p of particles) { ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); }
        ctx.globalAlpha=1.0;
        for(let t of floatingTexts) { ctx.globalAlpha=t.life; ctx.fillStyle=t.color; ctx.font=`bold ${24*t.scale}px Arial`; ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeText(t.text,t.x,t.y); ctx.fillText(t.text,t.x,t.y); }
        ctx.globalAlpha=1.0;
        
        ctx.fillStyle='#1D3557'; ctx.font='bold 16px Arial';
        if(gameMode==='1p') { ctx.fillText(`👤 ${p1Name}: ${sharedScore}`,canvas.width/2,25); ctx.fillText('❤️'.repeat(sharedLives),canvas.width/2,48); }
        else if(gameMode==='2p-coop') { ctx.fillText(`🤝 Equipo: ${sharedScore}`,canvas.width/2,25); ctx.fillText('❤️'.repeat(sharedLives),canvas.width/2,48); }
        else { ctx.textAlign='left'; ctx.fillText(`${p1Name}: ${score1}`,10,25); ctx.fillText('❤️'.repeat(lives1),10,45); ctx.textAlign='right'; ctx.fillText(`${p2Name}: ${score2}`,canvas.width-10,25); ctx.fillText('❤️'.repeat(lives2),canvas.width-10,45); }
        ctx.textAlign='center'; ctx.fillStyle='#E9C46A'; ctx.font='bold 20px Arial'; ctx.fillText(`Nivel ${level}`, canvas.width/2, 75);
        
        if(sizeBoostActive) {
          const barW = 100, barH = 12;
          const bx = canvas.width/2 - barW/2, by = magnetActive ? 125 : 105;
          ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.roundRect(bx-2, by-2, barW+4, barH+4, 8); ctx.fill();
          ctx.fillStyle = '#FF9800'; ctx.beginPath(); ctx.roundRect(bx, by, (sizeBoostTimer/SIZE_BOOST_DURATION)*barW, barH, 6); ctx.fill();
          ctx.fillStyle = '#FFF'; ctx.font = 'bold 11px Arial';
          ctx.fillText('📏 ' + Math.ceil(sizeBoostTimer/60) + 's', canvas.width/2, by + barH/2 + 1);
        }
        if(magnetActive) {
          const barW = 120, barH = 14;
          const bx = canvas.width/2 - barW/2, by = 105;
          ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.roundRect(bx-2,by-2,barW+4,barH+4,8); ctx.fill();
          ctx.fillStyle = '#00E5FF'; ctx.shadowColor = '#00E5FF'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.roundRect(bx,by,(magnetTimer/MAGNET_DURATION)*barW,barH,6); ctx.fill(); ctx.shadowBlur=0;
          ctx.fillStyle = '#FFF'; ctx.font = 'bold 12px Arial';
          ctx.fillText('🧲 ' + Math.ceil(magnetTimer/60) + 's', canvas.width/2, by+barH/2+1);
        }
        
        const rem=Math.max(0,targetPerLevel-collectedInLevel), cY=canvas.height-95, boxW=80, boxH=80;
        ctx.fillStyle='rgba(20,30,50,0.6)';
        if(gameMode==='1p'||gameMode==='2p-coop') { 
          ctx.fillRect(canvas.width/2-boxW/2,cY,boxW,boxH); 
          ctx.fillStyle='#FFF'; 
          ctx.font='bold 50px Arial'; 
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(rem,canvas.width/2,cY+boxH/2); 
        }
        else { 
          ctx.fillRect(canvas.width*0.25-boxW/2,cY,boxW,boxH); 
          ctx.fillRect(canvas.width*0.75-boxW/2,cY,boxW,boxH); 
          ctx.fillStyle='#FFF'; 
          ctx.font='bold 45px Arial'; 
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(rem,canvas.width*0.25,cY+boxH/2); 
          ctx.fillText(rem,canvas.width*0.75,cY+boxH/2); 
        }
      }
      
      if(gameState==='levelConfirm') {
        ctx.fillStyle='rgba(0,0,0,0.85)'; 
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.fillStyle='#4CAF50'; 
        ctx.font='bold 28px Arial'; 
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(currentLevelMessage, canvas.width/2, canvas.height * 0.25);
        
        const expSize = 200;
        const expCenterY = canvas.height * 0.5;
        drawExpression(canvas.width/2, expCenterY, expSize);
        
        ctx.fillStyle='#FFD166'; 
        ctx.font='bold 24px Arial'; 
        ctx.fillText(`Nivel ${level} completado`, canvas.width/2, canvas.height * 0.72);
        
        const nextLevelTarget = calculateTargetForLevel(level + 1);
        ctx.fillStyle='#E0E0E0'; 
        ctx.font='18px Arial'; 
        ctx.fillText(`🎯 Atrapa ${nextLevelTarget} objetos para el siguiente nivel`, canvas.width/2, canvas.height * 0.78);
        
        const bw=220, bh=55, btnY=canvas.height * 0.84;
        confirmBtnRect={x:canvas.width/2-bw/2, y:btnY, w:bw, h:bh};
        ctx.fillStyle='#E9C46A'; 
        ctx.beginPath(); 
        ctx.roundRect(confirmBtnRect.x, confirmBtnRect.y, confirmBtnRect.w, confirmBtnRect.h, 12); 
        ctx.fill();
        ctx.fillStyle='#1A1A2E'; 
        ctx.font='bold 20px Arial'; 
        ctx.fillText('▶ Siguiente Nivel', canvas.width/2, btnY+bh/2+2);
      }
      ctx.restore();
    }

    window.addEventListener('keydown', e=>keys[e.key]=true);
    window.addEventListener('keyup', e=>keys[e.key]=false);
    function handleInput(e) {
      e.preventDefault();
      if(gameState==='levelConfirm'||gameState==='gameOver') {
        const rect=wrapper.getBoundingClientRect(), scX=canvas.width/rect.width, scY=canvas.height/rect.height;
        let cx,cy;
        if(e.type.includes('touch')){cx=(e.touches[0].clientX-rect.left)*scX; cy=(e.touches[0].clientY-rect.top)*scY;}
        else{cx=(e.clientX-rect.left)*scX; cy=(e.clientY-rect.top)*scY;}
        if(confirmBtnRect && cx>=confirmBtnRect.x && cx<=confirmBtnRect.x+confirmBtnRect.w && cy>=confirmBtnRect.y && cy<=confirmBtnRect.y+confirmBtnRect.h){ playSound('click'); if(gameState==='levelConfirm') nextLevel(); else showMenu(); } return;
      }
      if(gameState==='playing'){
        const rect=wrapper.getBoundingClientRect(), scX=canvas.width/rect.width;
        for(let t of e.touches){
          const x=(t.clientX-rect.left)*scX;
          if(gameMode==='1p') basket1X=Math.max(basketW/2,Math.min(canvas.width-basketW/2,x));
          else{ if(x<canvas.width/2) basket1X=Math.max(basketW/2,Math.min(canvas.width*0.45,x)); else basket2X=Math.max(canvas.width*0.55,Math.min(canvas.width-basketW/2,x)); }
        }
      }
    }
    canvas.addEventListener('touchstart', handleInput, {passive:false});
    canvas.addEventListener('touchmove', handleInput, {passive:false});
    canvas.addEventListener('mousedown', handleInput);

    function nextLevel() {
      playSound('level'); 
      level++; 
      collectedInLevel=0;
      targetPerLevel = calculateTargetForLevel(level);
      fallSpeed += 0.15; 
      spawnInterval = Math.max(30, spawnInterval - 2);
      items=[]; 
      fallingPowerups=[]; 
      particles=[]; 
      floatingTexts=[];
      gameState='playing';
      scheduleNextMessage();
    }

    function gameLoop(time) { update(); draw(time); requestAnimationFrame(gameLoop); }
    initBlocks(); showSplashScreen(); gameLoop();
  </script>
</body>
</html>
